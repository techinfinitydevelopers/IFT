{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Payment - IFT</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        button, .btn, a[class*="btn"], input[type="button"], input[type="submit"] { text-decoration: none; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #f4f5f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 3rem 2.5rem;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            text-align: center;
        }
        .card h1 {
            font-size: 1.5rem;
            color: #1a1f2e;
            margin-bottom: 0.5rem;
        }
        .card p {
            color: #7a8194;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .amount {
            font-size: 3rem;
            font-weight: 700;
            color: #5E2A97;
            margin-bottom: 0.25rem;
        }
        .amount-label {
            color: #7a8194;
            font-size: 0.8rem;
            margin-bottom: 2rem;
        }
        .btn-pay {
            width: 100%;
            padding: 1rem;
            background: #5E2A97;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-pay:hover { background: #7B3FB5; }
        .result {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            display: none;
        }
        .result.success {
            background: #dcfce7;
            color: #166534;
            display: block;
        }
        .result.error {
            background: #fee2e2;
            color: #991b1b;
            display: block;
        }
        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: #5E2A97;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Test Payment</h1>
        <p>Verify Razorpay integration is working</p>
        <div class="amount">&#8377;1</div>
        <div class="amount-label">Test amount (will be charged)</div>
        <button class="btn-pay" id="payBtn" onclick="startPayment()">Pay &#8377;1 Now</button>
        <div class="result" id="result"></div>
        <a href="/dashboard/" class="back-link">&larr; Back to Dashboard</a>
    </div>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        function startPayment() {
            var options = {
                key: "{{ razorpay_key_id }}",
                amount: "{{ amount }}",
                currency: "{{ currency }}",
                name: "India's Future Tycoons",
                description: "Test Payment - Rs 1",
                order_id: "{{ order_id }}",
                prefill: {
                    name: "{{ user.get_full_name }}",
                    email: "{{ user.email }}"
                },
                theme: {
                    color: "#5E2A97"
                },
                handler: function(response) {
                    document.getElementById('payBtn').disabled = true;
                    document.getElementById('payBtn').textContent = 'Verifying...';
                    fetch('/test-payment/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': '{{ csrf_token }}'
                        },
                        body: JSON.stringify({
                            razorpay_payment_id: response.razorpay_payment_id,
                            razorpay_order_id: response.razorpay_order_id,
                            razorpay_signature: response.razorpay_signature
                        })
                    })
                    .then(r => r.json())
                    .then(data => {
                        var el = document.getElementById('result');
                        if (data.success) {
                            el.className = 'result success';
                            el.innerHTML = 'Payment successful! ID: ' + data.payment_id;
                        } else {
                            el.className = 'result error';
                            el.innerHTML = 'Verification failed: ' + data.message;
                        }
                        document.getElementById('payBtn').textContent = 'Done';
                    })
                    .catch(() => {
                        var el = document.getElementById('result');
                        el.className = 'result error';
                        el.innerHTML = 'Network error during verification.';
                        document.getElementById('payBtn').textContent = 'Pay ₹1 Now';
                        document.getElementById('payBtn').disabled = false;
                    });
                },
                modal: {
                    ondismiss: function() {}
                }
            };
            var rzp = new Razorpay(options);
            rzp.open();
        }
    </script>
</body>
</html>
