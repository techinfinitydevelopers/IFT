<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something went wrong - India's Future Tycoons</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        button, .btn, a[class*="btn"], input[type="button"], input[type="submit"] { text-decoration: none; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', -apple-system, sans-serif;
            background: linear-gradient(135deg, #f5f0ff 0%, #f4f5f8 100%);
            min-height: 100vh; display: flex; align-items: center;
            justify-content: center; padding: 2rem; text-align: center;
        }
        .box { max-width: 460px; }
        .code {
            font-size: 6rem; font-weight: 700; line-height: 1;
            background: linear-gradient(135deg, #5E2A97, #7B3FB5);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        h1 { font-size: 1.4rem; color: #1a1f2e; margin: 0.75rem 0 0.5rem; }
        p { color: #7a8194; font-size: 0.92rem; margin-bottom: 1.75rem; }
        .btn {
            display: inline-block; padding: 0.85rem 1.75rem; background: #5E2A97;
            color: #fff; text-decoration: none; border-radius: 12px;
            font-weight: 600; font-size: 0.9rem; transition: all 0.2s;
        }
        .btn:hover { background: #7B3FB5; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(94,42,151,0.3); }
    </style>
</head>
<body>
    <div class="box">
        <div class="code">500</div>
        <h1>Something went wrong</h1>
        <p>We hit a temporary problem. Please try again in a moment.</p>
        <a href="/" class="btn">Back to Home</a>
    </div>
</body>
</html>
